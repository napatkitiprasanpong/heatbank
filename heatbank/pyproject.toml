[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heatbank"
version = "0.6.1"
description = "HeatBank: a heat budget for every shift. Planning-stage prototype, not a medical device."
requires-python = ">=3.9"
dependencies = ["numpy", "pythermalcomfort==4.8.0", "thermofeel==2.3.0", "llvmlite==0.50.0", "numba==0.68.1"]   # pin exact versions after `python scripts/check_signatures.py` (U6)

[project.scripts]
heatbank = "heatbank.cli:main"

[tool.setuptools.packages.find]
include = ["heatbank*"]
